<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANASAN — Analítica predictiva del cierre de ventas</title>
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --ink: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #1d4ed8; --accent-soft: #eff6ff;
    --green: #15803d; --red: #b91c1c; --amber: #b45309;
    --hover: #f9fafb; --zebra: #fafbff;
    --c1: #1d4ed8; --c2: #7c3aed; --c3: #059669; --c4: #d97706;
    --th-bg: #eef2ff; --th-ink: #312e81; --th-line: #a5b4fc;
  }
  html.dark {
    --bg: #0b1120; --surface: #111827; --ink: #e5e7eb; --muted: #94a3b8;
    --line: #1f2937; --accent: #60a5fa; --accent-soft: #172554;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24;
    --hover: #1f2937; --zebra: #0f172a;
    --c1: #60a5fa; --c2: #a78bfa; --c3: #34d399; --c4: #fbbf24;
    --th-bg: #1e1b4b; --th-ink: #c7d2fe; --th-line: #3730a3;
  }
  html.dark body { color-scheme: dark; }
  html.dark table.thesis th { background: var(--th-bg); color: var(--th-ink); }
  html.dark table.thesis th, html.dark table.thesis td { border-color: #312e5a; }
  html.dark table.thesis tr:nth-child(even) td { background: #0f172a; }
  html.dark .action:hover { box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  html.dark .btn-plain { background: var(--surface); }
  html.dark input[type=number]::-webkit-inner-spin-button { opacity: .4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55;
  }
  .mono, table.data td, table.data th { font-variant-numeric: tabular-nums; }

  /* topbar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 14px; letter-spacing: .02em; }
  .brand span { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
  .topnav { display: flex; gap: 22px; }
  .topnav a {
    color: var(--muted); text-decoration: none; font-size: 13px; letter-spacing: .03em;
    padding-bottom: 2px; border-bottom: 1.5px solid transparent;
  }
  .topnav a:hover { color: var(--ink); }
  .topnav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  main { max-width: 1060px; margin: 0 auto; padding: 40px 32px 80px; }

  /* portada */
  .portada { display: flex; gap: 64px; align-items: flex-start; margin-top: 48px; }
  .portada-info { flex: 1; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  h1 { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; max-width: 26ch; }
  .lead { margin-top: 18px; color: var(--muted); max-width: 52ch; font-size: 14.5px; }
  .stat-row { display: flex; gap: 40px; margin-top: 36px; }
  .stat-row dt { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .stat-row dd { font-size: 22px; font-weight: 700; margin-top: 2px; color: var(--accent); }
  .portada-actions { width: 320px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .action {
    display: flex; align-items: center; gap: 16px; padding: 18px 20px;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 6px;
    text-decoration: none; color: var(--ink); font-size: 15px; font-weight: 600;
    transition: border-color .15s, box-shadow .15s;
  }
  .action:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .action .num { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  .action .desc { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .action.a1 { border-left-color: var(--c1); } .action.a1 .num { color: var(--c1); }
  .action.a2 { border-left-color: var(--c2); } .action.a2 .num { color: var(--c2); }
  .action.a3 { border-left-color: var(--c3); } .action.a3 .num { color: var(--c3); }
  .action.a4 { border-left-color: var(--c4); } .action.a4 .num { color: var(--c4); }

  /* secciones */
  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 28px; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .page-sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--ink); }

  .block { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; margin-bottom: 24px; }
  .block h3 { font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 860px) { .portada { flex-direction: column; gap: 32px; } .portada-actions { width: 100%; } .grid2 { grid-template-columns: 1fr; } }

  /* tablas */
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--ink);
  }
  table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  table.data tr:hover td { background: var(--hover); }
  table.data td.num, table.data th.num { text-align: right; }
  table.data td.ctr, table.data th.ctr { text-align: center; }
  table.data tr.best td { background: var(--accent-soft); font-weight: 600; }
  table.data tbody tr:nth-child(even) td { background: var(--zebra); }
  .scroll { overflow-x: auto; }

  /* ficha tesis */
  .ficha-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 24px; font-size: 13px; margin-bottom: 20px; }
  .ficha-meta .k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .ficha-meta .v { color: var(--ink); }
  table.thesis { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: center; }
  table.thesis th, table.thesis td { border: 1px solid var(--th-line); padding: 5px 8px; }
  table.thesis th { background: var(--th-bg); color: var(--th-ink); font-weight: 700; font-size: 11.5px; }
  table.thesis tr:nth-child(even) td { background: #f8fafc; }
  .nota { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* badges y form */
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
  .t-alta { color: var(--green); } .t-media { color: var(--amber); } .t-baja { color: var(--red); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; max-width: 560px; }
  .field label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px;
    font-size: 14px; background: var(--surface); color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .btn {
    margin-top: 20px; padding: 10px 22px; background: var(--accent); color: #fff; border: none;
    border-radius: 4px; font-size: 13.5px; font-weight: 600; cursor: pointer; letter-spacing: .02em;
  }
  .btn:hover { background: #1e40af; }
  .btn-plain { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-plain:hover { border-color: var(--accent); background: var(--surface); }
  .theme-btn {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    width: 34px; height: 34px; cursor: pointer; font-size: 15px; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  .top-right { display: flex; align-items: center; gap: 16px; }

  /* resultado predicción */
  .pred-result { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
  .prob-big { font-size: 46px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .prob-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .reco { color: var(--muted); font-size: 14px; max-width: 60ch; margin-top: 10px; }

  /* barras CSS */
  .bar-row { display: grid; grid-template-columns: 150px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
  .bar-track { background: var(--line); height: 8px; border-radius: 4px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 4px; }
  .bar-val { text-align: right; color: var(--muted); font-size: 12px; }

  .kpi-strip { display: flex; flex-wrap: wrap; gap: 32px; margin-bottom: 28px; }
  .kpi-strip .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .kpi-strip .v { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .err { color: var(--red); font-size: 14px; }
  .muted { color: var(--muted); font-size: 13.5px; }

  @media print {
    .topbar, .noprint { display: none !important; }
    main { padding: 0; max-width: none; }
    .block { border: none; padding: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#portada">CANASAN<span>Analítica predictiva del cierre de ventas</span></a>
  <div class="top-right">
    <nav class="topnav">
      <a href="#ficha" data-view="ficha">01 Ficha de registro</a>
      <a href="#metricas" data-view="metricas">02 Métricas</a>
      <a href="#resultados" data-view="resultados">03 Resultados</a>
      <a href="#prediccion" data-view="prediccion">04 Predicción</a>
    </nav>
    <button id="theme-btn" class="theme-btn" title="Cambiar modo claro/oscuro">◐</button>
  </div>
</header>
<main id="view"></main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/app.js?v=4"></script>
</body>
</html>
